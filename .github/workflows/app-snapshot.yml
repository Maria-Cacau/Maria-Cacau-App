name: app-snapshot

on:
  workflow_dispatch:
    inputs:
      clear-cache:
        description: "Limpar o cache do Nuitka antes de rodar (rebuild limpo)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  app-snapshot:
    uses: Maria-Cacau/Maria-Cacau-Actions/.github/workflows/app-snapshot.yml@v2
    with:
      clear-cache: ${{ inputs.clear-cache }}
